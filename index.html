<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Outfit:wght@800;900&family=Rajdhani:wght@700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=9" />
  <style>
    /* Optimize HTML & Body for Centered Canvas Preview */
    html,
    body {
      margin: 0;
      padding: 0;
      background: #000000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
    }

    .game-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 540px;
      height: 960px;
      margin: auto;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    #arena {
      width: 100%;
      height: 100%;
      object-fit: contain;
      margin: auto;
    }
  </style>
</head>

<body>
  <!-- Invisible drag handle for frameless window -->
  <div id="drag-region" style="position: absolute; top: 0; left: 0; width: 100%; height: 50px; -webkit-app-region: drag; z-index: 99999; cursor: grab;"></div>

  <div class="game-container">
    <div id="healthHudLeft" class="health-hud-side" aria-live="polite" style="display: none;"></div>
    <div class="game-box">
      <div id="hudTopContainer" class="hud-top-container">
        <div id="hudTopLeft" class="hud-name-box"></div>
        <div id="hudTopRight" class="hud-name-box"></div>
      </div>

      <canvas id="arena" width="540" height="960"></canvas>

      <div id="hudBottomContainer" class="hud-bottom-container">
        <div id="hudBottomLeft" class="hud-skill-group"></div>
        <div id="hudBottomRight" class="hud-skill-group"></div>
      </div>

      <div id="healthHud" class="health-hud" aria-live="polite" style="display: none;"></div>

      <!-- Phase 4: HTML UI Layer -->
      <div id="ui-layer">
        <!-- TITLE SCREEN -->
        <div id="title-screen" class="ui-screen active">
          <h1 class="game-title">CIRCLE BATTLE</h1>
          <div class="menu-buttons">
            <button id="btn-battle" class="premium-btn">⚔ BATTLE</button>
            <button id="btn-index" class="premium-btn">📖 FIGHTER INDEX</button>
            <button id="btn-weapons" class="premium-btn">⚔ WEAPONS</button>
            <button id="btn-hudmode" class="premium-btn">📋 HUD: SKILL BARS</button>
            <button id="btn-performance" class="premium-btn">⚙ PERFORMANCE: OFF</button>
            <button id="btn-fps" class="premium-btn">📊 FPS & LOGS: ON</button>
            <button id="btn-testmode" class="premium-btn">🧪 TEST MODE: OFF</button>
            <button id="btn-cinefilm" class="premium-btn">🎞️ CINEFILM FILTER: OFF</button>
            <button id="btn-leaderboard" class="premium-btn">🏆 LEADERBOARD</button>
          </div>
          <div class="menu-footer">Press SPACE/ENTER, Click BATTLE</div>
        </div>
      </div>

      <!-- Retro Cinefilm Filter Overlay -->
      <div id="cinefilm-overlay" class="cinefilm-overlay">
        <div class="cinefilm-grain"></div>
        <div class="cinefilm-color-grade"></div>
        <div class="cinefilm-timestamp">'98 08 13</div>
      </div>
    </div>
    <div id="healthHudRight" class="health-hud-side" aria-live="polite" style="display: none;"></div>
  </div>

  <!-- ES6 module entry point — all imports are resolved via import/export -->
  <script>
    window.addEventListener('error', (e) => {
      console.error('Global error:', e.message, e.filename, e.lineno);
    });
    window.addEventListener('unhandledrejection', (e) => {
      console.error('Unhandled rejection:', e.reason);
    });
  </script>

  <!-- PixiJS WebGL Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>

  <script type="module" src="js/core/main.js?v=3"></script>
</body>

</html>
