<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=Rajdhani:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Optimize HTML & Body for Centered Canvas Preview */
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
    }
    .game-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      max-width: 540px;
      max-height: 100vh;
      margin: auto;
      box-sizing: border-box;
    }
    #arena {
      width: 100%;
      height: auto;
      max-height: 100vh;
      object-fit: contain;
      margin: auto;
    }
    @media (min-aspect-ratio: 9/16) {
      .game-container {
        max-width: 540px;
      }
    }
  </style>
</head>

<body>
  <div class="game-container">
    <div id="healthHudLeft" class="health-hud-side" aria-live="polite" style="display: none;"></div>
    <div class="game-box">
      <div id="hudTopContainer" class="hud-top-container">
        <div id="hudTopLeft" class="hud-name-box"></div>
        <div id="hudTopRight" class="hud-name-box"></div>
      </div>

      <canvas id="arena" width="540" height="960"></canvas>

      <div id="hudBottomContainer" class="hud-bottom-container">
        <div id="hudBottomLeft" class="hud-skill-group"></div>
        <div id="hudBottomRight" class="hud-skill-group"></div>
      </div>
      
      <div id="healthHud" class="health-hud" aria-live="polite" style="display: none;"></div>
    </div>
    <div id="healthHudRight" class="health-hud-side" aria-live="polite" style="display: none;"></div>
  </div>

  <!-- ES6 module entry point — all imports are resolved via import/export -->
  <script>
    window.addEventListener('error', (e) => {
      console.error('Global error:', e.message, e.filename, e.lineno);
    });
    window.addEventListener('unhandledrejection', (e) => {
      console.error('Unhandled rejection:', e.reason);
    });
  </script>

  <script type="module" src="js/core/main.js"></script>
</body>

</html>
