name: Build & Release Web Distribution

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  verify-and-build:
    name: Verify, Bundle & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Codebase Integrity & Stack Depth Verification
        run: npm run verify

      - name: Fighter Simulation & Balance Suite Test
        run: npm test

      - name: Build & Package Protected Web Distribution
        run: npm run build:web

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ramball-fight-simulator-web-build
          path: dist/ramball-fight-simulator-web.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Ramball Fight Simulator ${{ inputs.release_tag || github.ref_name }}
          files: dist/ramball-fight-simulator-web.zip
          generate_release_notes: true
          draft: false
          prerelease: false
